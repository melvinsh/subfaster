# GoReleaser config — https://goreleaser.com
# Cut a release: bump `version` in pkg/runner/banners.go, then `git tag vX.Y.Z && git push --tags`.
version: 2

project_name: subfaster

before:
  hooks:
    - go mod tidy

builds:
  - main: ./cmd/subfaster
    binary: subfaster
    env:
      - CGO_ENABLED=0
    flags:
      - -trimpath
    ldflags:
      - -s -w
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64

archives:
  - formats: [tar.gz]
    name_template: >-
      {{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}
    format_overrides:
      - goos: windows
        formats: [zip]

checksum:
  name_template: checksums.txt

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^chore:"
      - Merge pull request
      - Merge branch

release:
  github:
    owner: melvinsh
    name: subfaster
